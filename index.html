<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venta de Vinilos</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main>
    <!-- El contenido visible va aquí -->
    <div class="contenedor">
        <h1>Venta de vinilos</h1>
        <h2>Bienvenido a nuestra tienda de vinilos</h2>
    </div>
    <div>
    <label for="artistas">¿Cuáles son tus artistas favoritos?</label>
        <select name="artistas">
            <option value="">-- Selecciona un artista --</option>
            <optgroup label="Artistas Populares">
                <option value="Mora">Mora</option>
                <option value="Quevedo">Quevedo</option>
                <option value="Jhayco">Jhayco</option>
                <option value="Bad Bunny">Bad Bunny</option>
                <option value="Rauw Alejandro">Rauw Alejandro</option>
                <option value="Feid">Feid</option>
                <option value="Karol G">Karol G</option>
            </optgroup>
            <optgroup label="Artistas Emergentes">
                <option value="Lucho RK">Lucho RK</option>
                <option value="La Pantera">La Pantera</option>
                <option value="Kapo">Kapo</option>
                <option value="Beéle">Beéle</option>
            </optgroup>
        </select>
    </div>
    <div>
        <h2>Basados en tus preferencias</h2>
            <p>Explora nuestra colección de vinilos</p>
            <p>Descubre los vinilos más populares y exclusivos de tus artistas favoritos.</p>
    </div>
        </main>
    </body>
</html>
